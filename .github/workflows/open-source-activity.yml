name: Update Open Source Activity Timeline

on:
  schedule:
    - cron: "25 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/open-source-activity.yml"
      - "scripts/update_open_source_activity.py"

permissions:
  contents: write

concurrency:
  group: open-source-activity-timeline
  cancel-in-progress: false

jobs:
  update-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Build timeline from public GitHub events
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: sayaklearner-prog
        run: python scripts/update_open_source_activity.py

      - name: Commit updated timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/open-source-activity.svg

          if git diff --cached --quiet; then
            echo "The activity timeline is already up to date."
          else
            git commit -m "chore(profile): refresh open source activity timeline [skip ci]"
            git push
          fi
