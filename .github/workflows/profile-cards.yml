name: Update GitHub Profile Dashboard

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Render unified profile dashboard
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: sayaklearner-prog
          cards: overview,languages,contributions,momentum,rhythm,repositories
          layout: combined
          output-dir: assets
          themes: light,dark
          palette: blue
          commit: true
          commit-message: "chore(profile): refresh unified analytics dashboard [skip ci]"
