name: Update GitHub Profile Dashboard

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: sayaklearner-prog
          cards: overview,contributions,momentum,languages,repositories,rhythm
          output-dir: assets
          themes: light,dark
          palette: blue
          commit: true
          commit-message: "chore(profile): update GitHub dashboard [skip ci]"
