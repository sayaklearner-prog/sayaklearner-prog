name: Generate 3D Contribution Landscape

on:
  schedule:
    - cron: "43 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-landscape
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution landscape
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated landscape
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No 3D contribution changes."
          else
            git commit -m "chore(profile): refresh 3D contribution landscape [skip ci]"
            git push
          fi
